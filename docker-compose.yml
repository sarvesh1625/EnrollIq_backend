version: '3.9'

services:

  # ── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cmr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE:      cmr_of_school
      MYSQL_USER:          cmr_user
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - admitflow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: cmr_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV:            production
      PORT:                5000
      DB_HOST:             mysql
      DB_PORT:             3306
      DB_NAME:             cmr_of_school
      DB_USER:             root
      DB_PASSWORD:         ${DB_PASSWORD}
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRES_IN:      7d
      CLIENT_URL:          ${CLIENT_URL}
      WHATSAPP_TOKEN:      ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID:   ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    ports:
      - "5000:5000"
    networks:
      - admitflow

  # ── Frontend (React) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ../admitflow
      dockerfile: Dockerfile
    container_name: cmr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - admitflow

networks:
  admitflow:
    driver: bridge

volumes:
  mysql_data:
    driver: local